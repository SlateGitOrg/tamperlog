[project]
name = "tamperlog"
version = "0.1.0"
description = "A hash-chained audit log that also detects re-chained truncation - the attack pure hash chaining silently passes."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
